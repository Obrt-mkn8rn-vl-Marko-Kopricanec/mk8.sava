name: Offline conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  MK8_SAVA_LIVE_AZURE_BLOB_CONNECTION_STRING: ''
  MK8_SAVA_LIVE_AZURE_HNS_CONNECTION_STRING: ''
  MK8_SAVA_TEST_CONFIGURATION: Release
  MK8_SAVA_TEST_SKIP_BUILD: '1'
  MK8_SAVA_AZURITE_SKIP_BUILD: '1'

jobs:
  sdk-and-rest:
    name: SDK and REST (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2025
            rid: win-x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore with strict analyzers
        run: dotnet restore Mk8.Sava.slnx -p:Mk8StrictAnalyzers=true
      - name: Strict Release build
        run: dotnet build Mk8.Sava.slnx --no-restore -c Release -p:Mk8StrictAnalyzers=true -m:1
      - name: Offline .NET SDK, REST and split-process tests
        run: dotnet test Mk8.Sava.slnx --no-build --no-restore -c Release --filter "Category!=LiveAzure&Category!=Azurite" --logger "trx;LogFileName=offline-${{ matrix.rid }}.trx"
      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format Mk8.Sava.slnx --verify-no-changes --no-restore --verbosity quiet
      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Pinned Azurite differential
        if: runner.os == 'Linux'
        run: bash Mk8.Sava.Tests/SdkCompatibility/azurite/run.sh
      - name: Independent JavaScript Blob SDK
        if: runner.os == 'Linux'
        run: bash Mk8.Sava.Tests/SdkCompatibility/javascript/run.sh
      - name: Publish Application and Gateway
        shell: pwsh
        run: |
          dotnet publish Mk8.Sava.Application/Mk8.Sava.Application.csproj -c Release -r ${{ matrix.rid }} --self-contained false -p:Mk8StrictAnalyzers=true -o artifacts/publish/Application
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish Mk8.Sava.Gateway/Mk8.Sava.Gateway.csproj -c Release -r ${{ matrix.rid }} --self-contained false -p:Mk8StrictAnalyzers=true -o artifacts/publish/Gateway
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute published Application and Gateway
        shell: pwsh
        run: ./deploy/Test-PublishedHosts.ps1 -PublishRoot artifacts/publish -EvidencePath artifacts/published-smoke
      - name: Freeze published release manifest
        shell: pwsh
        run: ./deploy/Write-ReleaseManifest.ps1 -PublishRoot artifacts/publish -RuntimeIdentifier ${{ matrix.rid }} -OutputPath artifacts/release-manifest.json
      - name: Retain source-bound release and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mk8-sava-${{ github.sha }}-${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/publish/
            artifacts/release-manifest.json
            artifacts/published-smoke/
            **/TestResults/**/*.trx
            **/TestResults/split-process-logs/*.log
