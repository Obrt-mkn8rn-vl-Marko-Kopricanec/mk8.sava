name: Offline conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  MK8_SAVA_LIVE_AZURE_BLOB_CONNECTION_STRING: ''
  MK8_SAVA_LIVE_AZURE_HNS_CONNECTION_STRING: ''

jobs:
  sdk-and-rest:
    name: SDK and REST (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore with strict analyzers
        run: dotnet restore Mk8.Sava.slnx -p:Mk8StrictAnalyzers=true
      - name: Strict Release build
        run: dotnet build Mk8.Sava.slnx --no-restore -c Release -p:Mk8StrictAnalyzers=true -m:1
      - name: Offline .NET SDK and REST tests
        run: dotnet test Mk8.Sava.slnx --no-build --no-restore -c Release --filter "Category!=LiveAzure&Category!=Azurite"
      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format Mk8.Sava.slnx --verify-no-changes --no-restore --verbosity quiet
      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Pinned Azurite differential
        if: runner.os == 'Linux'
        run: bash Mk8.Sava.Tests/SdkCompatibility/azurite/run.sh
      - name: Independent JavaScript Blob SDK
        if: runner.os == 'Linux'
        run: bash Mk8.Sava.Tests/SdkCompatibility/javascript/run.sh
